read_map:
  kind: read_file
  root: map/
  params:
    doc: {one_of_files_in: map/}

write_map:
  kind: write_file
  root: map/
  params:
    name: {pattern: "(SUB|CON|SEAM|INV|REC|REQ)-[a-z0-9-]+\\.md|(TRAPS|ERRATA|RESULTS|PROTECTED)\\.md"}
    body: {text: true}

read_code:
  kind: read_file
  root: heddle/
  params:
    path: {one_of_files_in: heddle/}

write_code:
  kind: write_file
  root: heddle/
  params:
    path: {pattern: "[a-z0-9_]{1,40}\\.py"}
    body: {text: true}

read_tests:
  kind: read_file
  root: tests_heddle/
  params:
    path: {one_of_files_in: tests_heddle/}

write_tests:
  kind: write_file
  root: tests_heddle/
  params:
    path: {pattern: "test_[a-z0-9_]{1,40}\\.py"}
    body: {text: true}

# Skill files themselves, for the skill-update flow. The write pattern
# allows one workflow-folder level; _under_root still guards escapes.
read_skill:
  kind: read_file
  root: skills/
  params:
    path: {one_of_files_in: skills/}

write_skill:
  kind: write_file
  root: skills/
  params:
    path: {pattern: "([a-z0-9-]{1,30}/)?[a-z0-9_-]{1,40}\\.md"}
    body: {text: true}

run_ring:
  kind: command
  command: ["python", "-m", "pytest", "{target}", "-q", "-x"]
  params:
    target: {pattern: "tests_heddle(/[a-z0-9_.]+)?(::[a-zA-Z0-9_]+)?"}

run_gate:
  kind: command
  command: ["python", "-m", "pytest", "-q"]

# The smoke wheel: one fast spin that proves the harness itself turns —
# packages load, flows parse non-vacuously, references resolve. Cheaper
# than a ring, far cheaper than the gate; run it first.
run_wheel:
  kind: command
  command: ["python", "-m", "pytest", "tests_heddle/test_smoke.py", "-q"]

protected_tripwire:
  kind: command
  command: ["git", "diff", "--name-only", "HEAD", "--", "heddle/", "map/", "HEDDLE_0_1.md"]

# The mechanical half of capture: write the requester's verbatim words
# and their numbered requirements into a REQ- doc. The thinking half
# (numbering, ambiguity routing, checkability) is specify's prose.
capture:
  kind: write_file
  root: map/
  params:
    name: {pattern: "REQ-[a-z0-9-]+\\.md"}
    body: {text: true}

# Adversarial-review artifacts. check records its findings as one JSON
# array (record_finding); collect reads that same file back
# (list_findings) so for_each can walk it; write_finding writes one
# report per finding.
record_finding:
  kind: write_file
  root: reports/
  params:
    name: {pattern: "findings\\.json"}
    body: {text: true}

list_findings:
  kind: read_json
  path: reports/findings.json

write_finding:
  kind: write_file
  root: reports/
  params:
    name: {pattern: "finding-[a-z0-9-]{1,40}\\.md"}
    body: {text: true}
