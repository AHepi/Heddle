# Orchestrator for diagnosing and fixing a defect. The order is the
# discipline: no code moves until the failure is understood (diagnose),
# demonstrated (reproduce), and approved by a human (propose gate).
# After the instruments go green, the review sub-flow reads the fix
# adversarially before the run is recorded. Every exit path ends in
# record. Skills live in skills/defect/ and skills/shared/, one step
# per file.
flow: defect
steps:
  - step: navigate.navigate
    as: worker

  - step: goal.goal
    as: worker

  - step: diagnose.diagnose
    as: worker

  - when: outcome(diagnose.diagnose) == inconclusive
    then:
      - ask: "Diagnosis is inconclusive. Review the evidence in the step summary and re-enter the flow with more; stopping here."
        options: [stop]
        store_as: diagnosis_halted
      - step: record.record
        as: recorder
    else:
      - step: reproduce.reproduce
        as: worker

      - step: propose.propose
        as: worker

      - ask: "Approve the proposed fix exactly as written?"
        options: [approve, reject]
        store_as: fix_approved

      - when: stored(fix_approved) == approve
        then:
          # Two implement-verify cycles at most. on_exhausted is continue,
          # not stop, so the run is still recorded; verify's red outcome is
          # what the record will show.
          - repeat:
              max: 2
              until: outcome(verify.verify) == green
              on_exhausted: continue
              steps:
                - step: implement.implement
                  as: implementer
                - step: verify.verify
                  as: validator

          # Green instruments are the fix's own claim; the review
          # sub-flow is the adversarial reader that tries to break it.
          - when: outcome(verify.verify) == green
            then:
              - call: review
              - when: outcome(check.check) == findings
                then:
                  - ask: "Verify passed but the adversarial review wrote findings to reports/; review them before re-entering the flow."
                    options: [noted]
                    store_as: review_findings_noted
          - step: record.record
            as: recorder
        else:
          - step: record.record
            as: recorder
