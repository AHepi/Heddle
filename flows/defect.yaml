name: defect
description: Orchestrator for diagnosing and fixing a defect.
items:
  - step: navigate.navigate
  - step: goal.goal
  - step: diagnose.diagnose
  - when:
      cond: "outcome(diagnose.diagnose) == inconclusive"
      then:
        - ask: "Diagnosis inconclusive. Provide more evidence or stop."
          options: [stop]
          store_as: diagnosis_halted
        - step: record.record
      else:
        - step: reproduce.reproduce
        - step: propose.propose
        - ask: "Approve the proposed fix?"
          options: [yes, no]
          store_as: fix_approved
        - when:
            cond: "stored(fix_approved) == yes"
            then:
              - repeat:
                  max: 2
                  until: "outcome(verify.verify) == green"
                  on_exhausted: continue
                  body:
                    - step: implement.implement
                    - step: verify.verify
              - step: record.record
            else:
              - step: record.record
