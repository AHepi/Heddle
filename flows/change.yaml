name: change
description: Orchestrator for making an addition or changing functionality.
items:
  - step: navigate.navigate
  - step: capture.capture
  - step: specify.specify
  - ask: "Spec gate: approve the requirement?"
    options: [yes, no]
    store_as: spec_ok
  - when:
      cond: "stored(spec_ok) == yes"
      then:
        - step: plan.plan
        - ask: "Plan gate: approve the plan?"
          options: [yes, no]
          store_as: plan_ok
        - when:
            cond: "stored(plan_ok) == yes"
            then:
              - repeat:
                  max: 8
                  until: "outcome(execute.execute_step) == all_done"
                  on_exhausted: continue
                  body:
                    - step: execute.execute_step
              - step: validate.validate
              - when:
                  cond: "outcome(validate.validate) == valid"
                  then:
                    - step: deliver.deliver
                    - step: record.record
                  else:
                    - ask: "Validation failed. Park the change."
                      options: [park]
                      store_as: validation_halted
                    - step: record.record
            else:
              - step: record.record
      else:
        - step: record.record
