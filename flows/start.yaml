# Router. Every task enters here and is routed to exactly one orchestrator.
# The called flows are self-contained (each opens with navigate and closes
# with record on every path), so this flow only asks and routes.
flow: start
steps:
  - ask: "Purpose? A defect is behavior that is wrong today; a change is behavior that should be different tomorrow; skill-update edits a skill file itself; cartography re-runs the map's recorded checks and re-stamps them; audit reads the permission system and reports least-privilege proposals."
    options: [defect, change, skill-update, cartography, audit]
    store_as: purpose

  - when: stored(purpose) == defect
    then:
      - call: defect
    else:
      - when: stored(purpose) == change
        then:
          - call: change
        else:
          - when: stored(purpose) == skill-update
            then:
              - call: skill-update
            else:
              - when: stored(purpose) == cartography
                then:
                  - call: cartography
                else:
                  - call: audit
