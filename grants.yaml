roles:
  worker:
    - tool: read_map
      form: full
      when: always
    - tool: write_map
      form: write_only
      when: [goal, specify, plan, deliver]
    - tool: read_code
      form: full
      when: [diagnose, reproduce, propose, specify, plan]
    - tool: read_tests
      form: full
      when: [diagnose, reproduce, propose, specify, plan]
    - tool: write_tests
      form: write_only
      when: [reproduce]
    - tool: capture
      form: write_only
      when: [specify]
    - tool: run_ring
      form: summary
      when: [diagnose, reproduce, propose]
    - tool: run_wheel
      form: summary
      when: [navigate]
    - tool: protected_tripwire
      form: summary
      when: [plan]
  implementer:
    - tool: read_code
      form: full
      when: always
    - tool: read_tests
      form: full
      when: always
    - tool: write_map
      form: write_only
      when: [execute_step]
    - tool: write_code
      form: write_only
      when: [implement, execute_step]
    - tool: write_tests
      form: write_only
      when: [implement, execute_step]
    - tool: run_ring
      form: summary
      when: [implement, execute_step]
  validator:
    - tool: run_wheel
      form: summary
      when: [verify, validate]
    - tool: run_ring
      form: summary
      when: [verify, validate]
    - tool: run_gate
      form: summary
      when: [verify, validate]
    - tool: protected_tripwire
      form: summary
      when: [validate]
  reviewer:
    - tool: read_map
      form: full
      when: always
    - tool: read_code
      form: full
      when: [check]
    - tool: read_tests
      form: full
      when: [check]
    - tool: run_ring
      form: scratch
      when: [check]
      limit: 20
    - tool: record_finding
      form: write_only
      when: [check]
    - tool: write_finding
      form: write_only
      when: [write_finding]
  editor:
    - tool: read_map
      form: full
      when: always
    - tool: read_skill
      form: full
      when: [survey, redraft]
    - tool: write_skill
      form: write_only
      when: [redraft]
    - tool: run_wheel
      form: summary
      when: [confirm]
  recorder:
    - tool: read_map
      form: full
      when: always
    - tool: write_map
      form: write_only
      when: [record]
    - tool: run_gate
      form: summary
      when: [record]
