roles:
  worker:
    - tool: read_map
      form: full
      when: always
    - tool: write_map
      form: write_only
      when: [goal, capture, specify, plan, deliver]
    - tool: read_code
      form: full
      when: [diagnose, reproduce, propose, specify, plan]
    - tool: read_tests
      form: full
      when: [diagnose, reproduce, propose, specify, plan]
    - tool: write_tests
      form: write_only
      when: [reproduce]
    - tool: run_ring
      form: summary
      when: [diagnose, reproduce, propose]
    - tool: protected_tripwire
      form: summary
      when: [plan]
  implementer:
    - tool: read_code
      form: full
      when: always
    - tool: read_tests
      form: full
      when: always
    - tool: write_code
      form: write_only
      when: [implement, execute_step]
    - tool: write_tests
      form: write_only
      when: [implement, execute_step]
    - tool: run_ring
      form: summary
      when: [implement, execute_step]
  validator:
    - tool: run_ring
      form: summary
      when: [verify, validate]
    - tool: run_gate
      form: summary
      when: [verify, validate]
    - tool: protected_tripwire
      form: summary
      when: [validate]
  recorder:
    - tool: read_map
      form: full
      when: always
    - tool: write_map
      form: write_only
      when: [record]
    - tool: run_gate
      form: summary
      when: [record]
